# Tous les hôtes de hotes-faux.txt arrivent ici (voir extra_hosts dans compose.yml), en HTTP et en HTTPS.
# Une requête sans l'un de ces noms sur le port 80 reste au vrai nginx.conf.sample.
# routeur.php décide quoi répondre selon l'hôte et le chemin. Il vit dans /banc, hors du docroot.
server {
	listen 443 ssl default_server;
	listen 80;
	include /etc/banc/noms-faux.conf;
	ssl_certificate /etc/banc/faux.crt;
	ssl_certificate_key /etc/banc/faux.key;

	location / {
		include fastcgi_params;
		fastcgi_pass 127.0.0.1:9000;
		fastcgi_param SCRIPT_FILENAME /banc/faux/routeur.php;
	}
}
